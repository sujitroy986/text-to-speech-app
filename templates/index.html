<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A K Singh Personal Voice Suite - Text to Speech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(13, 17, 27, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #2563eb;
      --accent: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Animated Gradient Mesh Background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      animation: ambientFloat 18s ease-in-out infinite alternate;
    }

    .sphere-1 {
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, #2563eb 0%, #1e1b4b 70%);
      top: -10%;
      left: -10%;
    }

    .sphere-2 {
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #9333ea 0%, #3b0764 70%);
      bottom: -10%;
      right: -10%;
      animation-duration: 22s;
    }

    .sphere-3 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, #0284c7 0%, transparent 70%);
      top: 35%;
      right: 25%;
      animation-duration: 15s;
    }

    .sphere-center-glow {
      width: 650px;
      height: 350px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.22) 0%, rgba(37, 99, 235, 0.12) 40%, transparent 75%);
      top: 0%;
      left: 50%;
      transform: translateX(-50%);
      animation: pulseAura 8s ease-in-out infinite alternate;
    }

    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    @keyframes ambientFloat {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 70px) scale(0.95); }
    }

    @keyframes pulseAura {
      0% { opacity: 0.35; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 0.75; transform: translateX(-50%) scale(1.1); }
    }

    /* Top Studio Navigation with Centered Title */
    .navbar {
      width: 100%;
      border-bottom: 1px solid var(--card-border);
      background: rgba(7, 9, 14, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Large Centered Title with Animated Neon Gradient Glow */
    .brand-text h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 15%, #bae6fd 50%, #38bdf8 85%, #60a5fa 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 7s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.55))
              drop-shadow(0 0 35px rgba(37, 99, 235, 0.4));
    }

    @keyframes titleShimmer {
      0% {
        background-position: 0% 50%;
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.5)) drop-shadow(0 0 28px rgba(37, 99, 235, 0.35));
      }
      100% {
        background-position: 100% 50%;
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.8)) drop-shadow(0 0 45px rgba(59, 130, 246, 0.6));
      }
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* Section Headings */
    .header-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-section h2 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #7dd3fc 75%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.45))
              drop-shadow(0 0 38px rgba(37, 99, 235, 0.3));
    }

    .header-section p {
      font-size: 0.98rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    /* Studio Card */
    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Toolbar Controls Header */
    .studio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }

    .input-pill:hover, .input-pill:focus-within {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .input-pill label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-pill select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .input-pill select option {
      background: #0f172a;
      color: #ffffff;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.06);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-btn:hover {
      background: rgba(56, 189, 248, 0.14);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .upload-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    #file-input {
      display: none;
    }

    /* Editor Area */
    .editor-wrapper {
      position: relative;
      border-radius: 14px;
      background: rgba(7, 9, 14, 0.65);
      border: 1px solid var(--card-border);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .editor-wrapper:focus-within {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .editor-textarea {
      width: 100%;
      height: 220px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      color: #f8fafc;
      font-size: 1rem;
      line-height: 1.65;
      padding: 18px 20px;
      font-family: inherit;
    }

    .editor-textarea::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(255, 255, 255, 0.015);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    .meta-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .clear-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .clear-action:hover {
      color: var(--danger);
    }

    .clear-action svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    /* Visualizer Strip */
    .visualizer-strip {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 26px;
      margin: 18px 0 6px;
    }

    .visualizer-strip.active {
      display: flex;
    }

    .wave-bar {
      width: 3.5px;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
      animation: soundPulse 0.8s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { animation-delay: 0.15s; }
    .wave-bar:nth-child(4) { animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { animation-delay: 0.25s; }
    .wave-bar:nth-child(6) { animation-delay: 0.35s; }
    .wave-bar:nth-child(7) { animation-delay: 0.2s; }

    @keyframes soundPulse {
      0% { height: 6px; opacity: 0.4; }
      100% { height: 24px; opacity: 1; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
    }

    /* Audio Player */
    .player-section {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }

    audio {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      outline: none;
      filter: invert(0.92) hue-rotate(180deg);
    }

    /* Actions Bar */
    .action-bar {
      margin-top: 24px;
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pro-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      font-family: inherit;
    }

    .pro-btn-primary {
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .pro-btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .pro-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text-main);
    }

    .pro-btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .pro-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .pro-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    /* Loading Spinner */
    .spinner {
      animation: rotate 1s linear infinite;
      display: none;
      width: 18px;
      height: 18px;
    }

    .spinner .path {
      stroke: #ffffff;
      stroke-linecap: round;
      animation: dash 1.5s ease-in-out infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    @keyframes dash {
      0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
      100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
    }

    .status-panel {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
      color: var(--accent);
      font-weight: 500;
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--card-border);
      background: rgba(7, 9, 14, 0.6);
      padding: 16px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-dim);
      position: relative;
      z-index: 2;
    }

    .footer strong {
      color: var(--text-muted);
    }

    @media (max-width: 680px) {
      .brand-text h1 { font-size: 1.35rem; }
      .header-section h2 { font-size: 1.6rem; }
      .studio-card { padding: 18px; }
      .studio-header { flex-direction: column; align-items: stretch; }
      .control-cluster { justify-content: space-between; }
      .action-bar { flex-direction: column; }
      .action-bar .pro-btn { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Dynamic Ambient Background Mesh -->
  <div class="animated-bg">
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    <div class="ambient-sphere sphere-3"></div>
    <div class="ambient-sphere sphere-center-glow"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Top Studio Header (Centered & Enlarged) -->
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-text">
          <h1>A K Singh Personal Voice Suite</h1>
        </div>
      </div>
    </div>
  </nav>

  <!-- Studio Workstation -->
  <main class="app-container">
    
    <!-- Title Section -->
    <div class="header-section">
      <h2>Text to Speech Converter</h2>
      <p>Turn real-world text into accurate speech - fast, simple and reliable</p>
    </div>

    <div class="studio-card">
      
      <!-- Controls Toolbar -->
      <div class="studio-header">
        <div class="control-cluster">
          <div class="input-pill">
            <label for="voice-select">Voice</label>
            <select id="voice-select">
              <option value="hi_male" selected>Hindi Male (Madhur)</option>
              <option value="hi_female">Hindi Female (Swara)</option>
              <option value="en_male">Indian English Male (Prabhat)</option>
              <option value="en_female">Indian English Female (Neerja)</option>
            </select>
          </div>

          <div class="input-pill">
            <label for="speed-select">Speed</label>
            <select id="speed-select">
              <option value="0.75x">0.75x</option>
              <option value="1.0x" selected>1.0x (Normal)</option>
              <option value="1.25x">1.25x</option>
              <option value="1.5x">1.5x</option>
            </select>
          </div>
        </div>

        <label for="file-input" class="upload-btn">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span>Upload PDF / DOC</span>
        </label>
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      </div>

      <!-- Integrated Textarea Editor with Footer Meta -->
      <div class="editor-wrapper">
        <textarea id="text-input" class="editor-textarea" placeholder="यहाँ हिंदी या अंग्रेज़ी टेक्स्ट लिखें या पेस्ट करें... Type or upload here..."></textarea>
        <div class="editor-footer">
          <button id="clear-btn" class="clear-action" title="Clear input">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear Text
          </button>
          <div class="meta-counter" id="char-word-count">0 characters · 0 words</div>
        </div>
      </div>

      <!-- Real-time Equalizer Waveform -->
      <div id="visualizer" class="visualizer-strip">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <!-- Audio Playback -->
      <div class="player-section">
        <audio id="audio-player" controls style="display: none;"></audio>
      </div>

      <!-- Studio Actions -->
      <div class="action-bar">
        <button id="download-btn" class="pro-btn pro-btn-secondary" disabled>
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download Audio</span>
        </button>

        <button id="convert-btn" class="pro-btn pro-btn-primary">
          <svg id="mic-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg id="spinner-icon" class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
          <span id="convert-btn-text">Convert to Audio</span>
        </button>
      </div>

      <div id="status" class="status-panel"></div>
    </div>
  </main>

  <footer class="footer">
    <span>Designed and Developed - <strong>S K Roy</strong></span>
  </footer>

  <script>
    let currentAudioBlob = null;
    const textInput = document.getElementById('text-input');
    const convertBtn = document.getElementById('convert-btn');
    const convertBtnText = document.getElementById('convert-btn-text');
    const micIcon = document.getElementById('mic-icon');
    const spinnerIcon = document.getElementById('spinner-icon');
    const downloadBtn = document.getElementById('download-btn');
    const clearBtn = document.getElementById('clear-btn');
    const audioPlayer = document.getElementById('audio-player');
    const statusMsg = document.getElementById('status');
    const fileInput = document.getElementById('file-input');
    const voiceSelect = document.getElementById('voice-select');
    const speedSelect = document.getElementById('speed-select');
    const charWordCount = document.getElementById('char-word-count');
    const visualizer = document.getElementById('visualizer');

    function updateCounter() {
      const text = textInput.value;
      const charCount = text.length;
      const trimmed = text.trim();
      const wordCount = trimmed ? trimmed.split(/\s+/).length : 0;
      charWordCount.textContent = `${charCount} characters · ${wordCount} words`;
    }
    textInput.addEventListener('input', updateCounter);

    audioPlayer.addEventListener('play', () => visualizer.classList.add('active'));
    audioPlayer.addEventListener('pause', () => visualizer.classList.remove('active'));
    audioPlayer.addEventListener('ended', () => visualizer.classList.remove('active'));

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusMsg.textContent = `Processing document: ${file.name}...`;
      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/api/extract-text', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          let errText = 'Extraction failed';
          try {
            const errJson = await response.json();
            errText = errJson.error || errText;
          } catch (_) {
            errText = await response.text();
          }
          throw new Error(errText);
        }

        const data = await response.json();
        textInput.value = data.text;
        updateCounter();
        statusMsg.textContent = `Successfully loaded ${file.name}`;
      } catch (err) {
        statusMsg.textContent = `Upload Error: ${err.message}`;
      } finally {
        fileInput.value = '';
      }
    });

    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      audioPlayer.pause();
      audioPlayer.src = '';
      audioPlayer.style.display = 'none';
      visualizer.classList.remove('active');
      currentAudioBlob = null;
      downloadBtn.disabled = true;
      fileInput.value = '';
      updateCounter();
      statusMsg.textContent = 'Cleared editor content.';
      textInput.focus();
    });

    convertBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      if (!text) {
        statusMsg.textContent = 'Please enter or import text before generating audio.';
        return;
      }

      const voice = voiceSelect.value;
      const speed = speedSelect.value;
      const selectedVoiceLabel = voiceSelect.options[voiceSelect.selectedIndex].text;

      statusMsg.textContent = `Synthesizing with ${selectedVoiceLabel} at ${speed}... Please wait.`;
      convertBtn.disabled = true;
      downloadBtn.disabled = true;
      micIcon.style.display = 'none';
      spinnerIcon.style.display = 'inline-block';
      convertBtnText.textContent = 'Processing...';

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, voice: voice, speed: speed })
        });

        if (!response.ok) {
          let errorText = 'Synthesis error';
          try {
            const errData = await response.json();
            errorText = errData.error || errorText;
          } catch (_) {
            errorText = await response.text();
          }
          throw new Error(errorText);
        }

        currentAudioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(currentAudioBlob);

        audioPlayer.src = audioUrl;
        audioPlayer.style.display = 'block';
        audioPlayer.play();

        downloadBtn.disabled = false;
        statusMsg.textContent = 'Audio ready and playing!';
      } catch (err) {
        statusMsg.textContent = 'Error: ' + err.message;
      } finally {
        convertBtn.disabled = false;
        micIcon.style.display = 'inline-block';
        spinnerIcon.style.display = 'none';
        convertBtnText.textContent = 'Convert to Audio';
      }
    });

    downloadBtn.addEventListener('click', async () => {
      if (!currentAudioBlob) return;
      const fileName = `aksingh_${voiceSelect.value}_${speedSelect.value}.mp3`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{
              description: 'MP3 Audio File',
              accept: { 'audio/mpeg': ['.mp3'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(currentAudioBlob);
          await writable.close();
          statusMsg.textContent = 'File saved to disk.';
        } catch (err) {
          if (err.name !== 'AbortError') {
            statusMsg.textContent = 'Save cancelled.';
          }
        }
      } else {
        const url = URL.createObjectURL(currentAudioBlob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
        statusMsg.textContent = 'Download started!';
      }
    });
  </script>
</body>
</html>
