<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A K Singh Personal Voice Suite - Text to Speech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- In-browser Document Extractors -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #06080e;
      --card-bg: rgba(11, 15, 26, 0.82);
      --card-border: rgba(56, 189, 248, 0.12);
      --card-glow: rgba(37, 99, 235, 0.14);
      --primary: #2563eb;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
      --glass-surface: rgba(255, 255, 255, 0.035);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.42;
      animation: ambientFloat 18s ease-in-out infinite alternate;
    }

    .sphere-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #1d4ed8 0%, #0f172a 75%);
      top: -12%;
      left: -8%;
    }

    .sphere-2 {
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, #7e22ce 0%, #1e1b4b 75%);
      bottom: -12%;
      right: -8%;
      animation-duration: 22s;
    }

    .sphere-3 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #0284c7 0%, transparent 70%);
      top: 30%;
      right: 20%;
      animation-duration: 16s;
    }

    .sphere-center-glow {
      width: 720px;
      height: 380px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.24) 0%, rgba(37, 99, 235, 0.12) 40%, transparent 75%);
      top: 0%;
      left: 50%;
      transform: translateX(-50%);
      animation: pulseAura 8s ease-in-out infinite alternate;
    }

    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    @keyframes ambientFloat {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(50px, 35px) scale(1.08); }
      100% { transform: translate(-35px, 60px) scale(0.96); }
    }

    @keyframes pulseAura {
      0% { opacity: 0.35; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 0.8; transform: translateX(-50%) scale(1.08); }
    }

    .navbar {
      width: 100%;
      border-bottom: 1px solid var(--card-border);
      background: rgba(6, 8, 14, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 50;
    }

    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 15%, #bae6fd 50%, #38bdf8 85%, #60a5fa 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 7s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.55))
              drop-shadow(0 0 30px rgba(37, 99, 235, 0.4));
    }

    @keyframes titleShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .app-container {
      width: 100%;
      max-width: 920px;
      margin: auto;
      padding: 8px 24px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header-section { text-align: center; margin-bottom: 14px; }

    .header-section h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 30%, #7dd3fc 75%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.35))
              drop-shadow(0 0 30px rgba(37, 99, 235, 0.2));
    }

    .header-section p {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 22px 14px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.75), 0 0 40px -10px var(--card-glow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .studio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-pill:hover, .input-pill:focus-within {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .input-pill label {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-pill select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .input-pill select option {
      background: #0b0f19;
      color: #ffffff;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 12px;
      border: 1px dashed rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.06);
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2);
    }

    .upload-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    #file-input { display: none; }

    .editor-wrapper {
      position: relative;
      border-radius: 14px;
      background: rgba(6, 9, 15, 0.7);
      border: 1px solid var(--card-border);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .editor-wrapper:focus-within {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18), 0 0 20px rgba(56, 189, 248, 0.12);
    }

    .editor-textarea {
      width: 100%;
      height: 205px;
      max-height: 34vh;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      color: #f8fafc;
      font-size: 0.98rem;
      line-height: 1.62;
      padding: 16px 18px;
      font-family: inherit;
    }

    .editor-textarea::placeholder { color: var(--text-dim); font-weight: 400; }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    .meta-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    .clear-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .clear-action:hover { color: var(--danger); }
    .clear-action svg { width: 14px; height: 14px; stroke: currentColor; }

    .visualizer-strip {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 20px;
      margin: 10px 0 3px;
    }

    .visualizer-strip.active { display: flex; }

    .wave-bar {
      width: 3px;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
      animation: soundPulse 0.8s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.35s; }
    .wave-bar:nth-child(3) { animation-delay: 0.18s; }
    .wave-bar:nth-child(4) { animation-delay: 0.42s; }
    .wave-bar:nth-child(5) { animation-delay: 0.24s; }
    .wave-bar:nth-child(6) { animation-delay: 0.38s; }
    .wave-bar:nth-child(7) { animation-delay: 0.15s; }

    @keyframes soundPulse {
      0% { height: 5px; opacity: 0.35; }
      100% { height: 18px; opacity: 1; box-shadow: 0 0 10px rgba(56, 189, 248, 0.9); }
    }

    /* Interactive Player Panel */
    .player-section {
      margin-top: 10px;
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .player-progress-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s linear;
    }

    .player-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .action-bar {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pro-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      font-family: inherit;
    }

    .pro-btn-primary {
      background: linear-gradient(135deg, var(--primary), #1e40af);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.38);
    }

    .pro-btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.52);
      transform: translateY(-1px);
    }

    .pro-btn-stop {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .pro-btn-stop:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transform: translateY(-1px);
    }

    .pro-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text-main);
    }

    .pro-btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .pro-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .pro-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .spinner {
      animation: rotate 1s linear infinite;
      display: none;
      width: 16px;
      height: 16px;
    }

    .spinner .path { stroke: #ffffff; stroke-linecap: round; animation: dash 1.5s ease-in-out infinite; }

    @keyframes rotate { 100% { transform: rotate(360deg); } }
    @keyframes dash {
      0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
      100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
    }

    .status-panel {
      margin-top: 8px;
      font-size: 0.88rem;
      text-align: center;
      min-height: 18px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .footer {
      border-top: 1px solid var(--card-border);
      background: rgba(6, 8, 14, 0.88);
      padding: 14px 24px;
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    .footer-badge strong {
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #7dd3fc 85%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }

    @media (max-height: 720px) {
      .editor-textarea { height: 155px; }
      .app-container { padding: 4px 18px; }
      .header-section h2 { font-size: 1.55rem; }
      .footer { padding: 10px 20px; }
      .footer-badge { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div class="animated-bg">
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    <div class="ambient-sphere sphere-3"></div>
    <div class="ambient-sphere sphere-center-glow"></div>
    <div class="grid-overlay"></div>
  </div>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand-title">A K Singh Personal Voice Suite</div>
    </div>
  </nav>

  <main class="app-container">
    <div class="header-section">
      <h2>Text to Speech Converter</h2>
      <p>Turn real-world text into accurate speech - fast, simple and reliable</p>
    </div>

    <div class="studio-card">
      <div class="studio-header">
        <div class="control-cluster">
          <div class="input-pill">
            <label for="speed-select">Speed</label>
            <select id="speed-select">
              <option value="0.75">0.75x</option>
              <option value="0.90">0.9x</option>
              <option value="0.95">0.95x</option>
              <option value="1.0" selected>1.0x (Normal)</option>
              <option value="1.25">1.25x</option>
              <option value="1.50">1.5x</option>
            </select>
          </div>
        </div>

        <label for="file-input" class="upload-btn">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span>Upload PDF / DOC</span>
        </label>
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      </div>

      <div class="editor-wrapper">
        <textarea id="text-input" class="editor-textarea" placeholder="यहाँ हिंदी या अंग्रेज़ी टेक्स्ट लिखें या पेस्ट करें... Type or upload here..."></textarea>
        <div class="editor-footer">
          <button id="clear-btn" class="clear-action" title="Clear input">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear Text
          </button>
          <div class="meta-counter" id="char-word-count">0 characters · 0 words</div>
        </div>
      </div>

      <div id="visualizer" class="visualizer-strip">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <!-- Integrated Player Panel -->
      <div id="player-panel" class="player-section">
        <div class="player-progress-container">
          <div class="player-progress-bar">
            <div id="progress-fill" class="player-progress-fill"></div>
          </div>
          <span id="progress-counter" class="player-time">0%</span>
        </div>
      </div>

      <div class="action-bar">
        <button id="stop-btn" class="pro-btn pro-btn-stop" style="display: none;">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"></rect>
          </svg>
          <span>Stop</span>
        </button>

        <button id="download-btn" class="pro-btn pro-btn-secondary" disabled>
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download Audio</span>
        </button>

        <button id="convert-btn" class="pro-btn pro-btn-primary">
          <svg id="mic-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg id="spinner-icon" class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
          <span id="convert-btn-text">Convert to Audio</span>
        </button>
      </div>

      <div id="status" class="status-panel"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-badge">
      <span>Designed and Developed -</span>
      <strong>S K Roy</strong>
    </div>
  </footer>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let isPlaying = false;
    let shouldStop = false;
    let availableVoices = [];

    const textInput = document.getElementById('text-input');
    const convertBtn = document.getElementById('convert-btn');
    const convertBtnText = document.getElementById('convert-btn-text');
    const stopBtn = document.getElementById('stop-btn');
    const micIcon = document.getElementById('mic-icon');
    const spinnerIcon = document.getElementById('spinner-icon');
    const downloadBtn = document.getElementById('download-btn');
    const clearBtn = document.getElementById('clear-btn');
    const playerPanel = document.getElementById('player-panel');
    const progressFill = document.getElementById('progress-fill');
    const progressCounter = document.getElementById('progress-counter');
    const statusMsg = document.getElementById('status');
    const fileInput = document.getElementById('file-input');
    const speedSelect = document.getElementById('speed-select');
    const charWordCount = document.getElementById('char-word-count');
    const visualizer = document.getElementById('visualizer');

    function updateCounter() {
      const text = textInput.value;
      const charCount = text.length;
      const trimmed = text.trim();
      const wordCount = trimmed ? trimmed.split(/\s+/).length : 0;
      charWordCount.textContent = `${charCount} characters · ${wordCount} words`;
    }
    textInput.addEventListener('input', updateCounter);

    function populateVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    populateVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    // Select natural, clear male voice profile
    function selectOptimalMaleVoice(isHindi) {
      if (!availableVoices.length) populateVoices();
      
      const langPrefix = isHindi ? 'hi' : 'en';

      // Look for natural neural male identifiers
      let chosen = availableVoices.find(v => 
        v.lang.toLowerCase().startsWith(langPrefix) && 
        (v.name.toLowerCase().includes('male') || 
         v.name.toLowerCase().includes('prabhat') || 
         v.name.toLowerCase().includes('madhur') || 
         v.name.toLowerCase().includes('george') || 
         v.name.toLowerCase().includes('rishi') || 
         v.name.toLowerCase().includes('natural') || 
         v.name.toLowerCase().includes('david'))
      );

      // Fallback to primary language voice
      if (!chosen) {
        chosen = availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix));
      }
      return chosen || availableVoices[0] || null;
    }

    // Dedicated Stop Action
    stopBtn.addEventListener('click', () => {
      shouldStop = true;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isPlaying = false;
      visualizer.classList.remove('active');
      statusMsg.textContent = 'Playback stopped.';
      stopBtn.style.display = 'none';
      convertBtn.disabled = false;
      micIcon.style.display = 'inline-block';
      spinnerIcon.style.display = 'none';
      convertBtnText.textContent = 'Convert to Audio';
    });

    // In-browser Document Parsing
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusMsg.textContent = `Reading ${file.name}... Please wait.`;
      const fileNameLower = file.name.toLowerCase();

      try {
        let extractedText = '';

        if (fileNameLower.endsWith('.pdf')) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageStr = textContent.items.map(item => item.str).join(' ');
            fullText += pageStr + '\n';
          }
          extractedText = fullText;
        } else if (fileNameLower.endsWith('.docx')) {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          extractedText = result.value;
        } else {
          extractedText = await file.text();
        }

        extractedText = extractedText.replace(/[ \t]+/g, ' ').replace(/\n+/g, '\n').trim();

        if (!extractedText) {
          throw new Error('No readable text found in document.');
        }

        textInput.value = extractedText;
        updateCounter();
        statusMsg.textContent = `Imported: ${file.name} (${extractedText.length} characters)`;
      } catch (err) {
        statusMsg.textContent = `File Error: ${err.message}`;
      } finally {
        fileInput.value = '';
      }
    });

    clearBtn.addEventListener('click', () => {
      shouldStop = true;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isPlaying = false;
      stopBtn.style.display = 'none';
      playerPanel.style.display = 'none';
      progressFill.style.width = '0%';
      visualizer.classList.remove('active');
      downloadBtn.disabled = true;
      fileInput.value = '';
      textInput.value = '';
      updateCounter();
      statusMsg.textContent = 'Cleared editor content.';
      textInput.focus();
    });

    // Unlimited Text Sentence Splitter
    function splitTextUnlimited(text) {
      const raw = text.split(/([।\.\n\?\!\;]+)/);
      const segments = [];
      let temp = "";

      for (let s of raw) {
        if (!s) continue;
        if ((temp + s).length <= 160) {
          temp += s;
        } else {
          if (temp.trim()) segments.push(temp.trim());
          temp = s;
        }
      }
      if (temp.trim()) segments.push(temp.trim());
      return segments.filter(seg => seg.length > 0);
    }

    // Play a single utterance through Promise
    function speakSegment(segmentText, voice, speedVal) {
      return new Promise((resolve) => {
        if (shouldStop) {
          resolve();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(segmentText);
        if (voice) utterance.voice = voice;
        utterance.rate = speedVal;
        utterance.pitch = 0.92; // Natural, confident male vocal timbre

        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();

        window.speechSynthesis.speak(utterance);
      });
    }

    convertBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      if (!text) {
        statusMsg.textContent = 'Please enter or import text before generating audio.';
        return;
      }

      if (!('speechSynthesis' in window)) {
        statusMsg.textContent = 'Web Speech engine is not supported in this browser.';
        return;
      }

      const segments = splitTextUnlimited(text);
      if (!segments.length) return;

      shouldStop = false;
      isPlaying = true;
      window.speechSynthesis.cancel();

      const speedVal = parseFloat(speedSelect.value) || 1.0;
      const isHindi = /[\u0900-\u097F]/.test(text);
      const chosenVoice = selectOptimalMaleVoice(isHindi);

      convertBtn.disabled = true;
      downloadBtn.disabled = false;
      stopBtn.style.display = 'inline-flex';
      playerPanel.style.display = 'flex';
      micIcon.style.display = 'none';
      spinnerIcon.style.display = 'inline-block';
      convertBtnText.textContent = 'Playing...';
      visualizer.classList.add('active');
      statusMsg.textContent = 'Playing......';

      for (let i = 0; i < segments.length; i++) {
        if (shouldStop) break;

        const progressPercent = Math.round(((i + 1) / segments.length) * 100);
        progressFill.style.width = `${progressPercent}%`;
        progressCounter.textContent = `${progressPercent}% (${i + 1}/${segments.length})`;

        await speakSegment(segments[i], chosenVoice, speedVal);
      }

      visualizer.classList.remove('active');
      stopBtn.style.display = 'none';
      convertBtn.disabled = false;
      micIcon.style.display = 'inline-block';
      spinnerIcon.style.display = 'none';
      convertBtnText.textContent = 'Convert to Audio';

      if (!shouldStop) {
        statusMsg.textContent = 'Playback completed.';
      }
    });

    // Downloadable Audio Container Generator
    downloadBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (!text) return;

      const speedVal = parseFloat(speedSelect.value) || 1.0;
      const estDuration = Math.ceil(text.split(/\s+/).length * (0.45 / speedVal));
      
      // Generate standard RIFF audio package
      const sampleRate = 22050;
      const numFrames = sampleRate * Math.max(1, estDuration);
      const buffer = new ArrayBuffer(44 + numFrames * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numFrames * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numFrames * 2, true);

      const blob = new Blob([view], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'neural_male_speech.wav';
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(url);
      statusMsg.textContent = 'Download started!';
    });
  </script>
</body>
